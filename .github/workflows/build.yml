# Builds each add-on image on GitHub so the HA Green only has to download it.
# Home Assistant pulls ghcr.io/j0eyoung/<arch>-<image>:<version from the add-on's config.yaml>.
# To add an add-on: put it in its own folder and add one line per arch to the matrix.
name: Build add-on images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push replaces an in-flight build of the same branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { addon: ski_assistant, image: ski-assistant, arch: amd64, runner: ubuntu-24.04 }
          - { addon: ski_assistant, image: ski-assistant, arch: aarch64, runner: ubuntu-24.04-arm }
          - { addon: workout_tracker, image: ai-workout, arch: amd64, runner: ubuntu-24.04 }
          - { addon: workout_tracker, image: ai-workout, arch: aarch64, runner: ubuntu-24.04-arm }
          - { addon: meal_planner, image: meal-planner, arch: amd64, runner: ubuntu-24.04 }
          - { addon: meal_planner, image: meal-planner, arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: echo "version=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?/\1/p' ${{ matrix.addon }}/config.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.addon }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.addon }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon }}-${{ matrix.arch }}
