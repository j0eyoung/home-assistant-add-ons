name: "Friend Reminder"
description: "Reminds you to reach out to friends you haven't talked to in a while: a daily phone nudge with Done / Snooze / Skip, birthdays first, and Claude-drafted openers."
version: "0.1.3"
slug: "friend_reminder"
image: "ghcr.io/j0eyoung/{arch}-ha-friend-reminder"
arch:
  - aarch64
  - amd64
init: false
# Served only through Home Assistant (Open Web UI + sidebar panel). No port is published to the LAN.
ingress: true
ingress_port: 8503
panel_icon: mdi:account-heart
panel_title: "Friends"
# Home Assistant API: the phone nudges (notify service) and the Done / Snooze / Skip button taps.
# No hassio_api: every add-on may read its own /addons/self/info (the slug a tapped notification opens).
homeassistant_api: true
# The add-on's own config folder (mounted at /config inside the container) holds friend_reminder.db.
# It is not the whole Home Assistant config folder.
map:
  - type: addon_config
    read_only: false
  - type: homeassistant_config
    read_only: true
options:
  anthropic_api_key: ""
  model: "claude-opus-5-5"
  notify_service: ""
  nudge_time: "12:00"
  nudges_per_day: 1
schema:
  anthropic_api_key: password?
  model: "list(claude-opus-5-5|claude-sonnet-5-5|claude-haiku-5-5)?"
  notify_service: str?
  nudge_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?"
  nudges_per_day: "int(1,2)?"
