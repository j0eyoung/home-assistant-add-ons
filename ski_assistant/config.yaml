name: "Ski Assistant"
description: "16-day snow forecasts for your resorts, Daily Snow, radar, powder alerts, best-day picks, leave times and a season log."
version: "0.4.3"
slug: "ski_assistant"
image: "ghcr.io/j0eyoung/{arch}-ski-assistant"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:ski
panel_title: "Ski"
map:
  - config:rw
# Home Assistant API: phone notifications, speaker announcements, lights, thermostat, shopping list, sensors
homeassistant_api: true
hassio_api: true
options:
  powder_alert_inches: 6
  claude_code_oauth_token: ""
  cotrip_api_key: ""
schema:
  powder_alert_inches: int(1,48)
  claude_code_oauth_token: password?
  cotrip_api_key: password?
