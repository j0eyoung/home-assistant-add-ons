name: "Ski Assistant"
description: "Where and when to ski or ride: powder alerts, best-day picks, leave times and a season log."
version: "0.2.0"
slug: "ski_assistant"
image: "ghcr.io/j0eyoung/{arch}-ski-assistant"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:ski
panel_title: "Ski"
map:
  - config:rw
# Home Assistant API: phone notifications, speaker announcements, lights, thermostat, shopping list, sensors
homeassistant_api: true
hassio_api: true
options:
  powder_alert_inches: 6
  anthropic_api_key: ""
schema:
  powder_alert_inches: int(1,48)
  anthropic_api_key: password?
