configuration:
  powder_alert_inches:
    name: Powder alert (inches)
    description: >-
      A resort counts as a powder alert when this much snow is forecast over the next two days. The
      powder-morning wake-up uses the same amount of fresh snow.
  claude_code_oauth_token:
    name: Claude token (optional)
    description: >-
      Daily Snow and Ask Claude run on your Claude subscription through Claude Code (no API fees). The easy way
      is Settings > Connect Claude inside the app. Or run `claude setup-token` in the Claude Terminal add-on and
      paste the token here. Stays on your Home Assistant.
  cotrip_api_key:
    name: COtrip API key (optional)
    description: >-
      Live I-70 incidents, road conditions, closures and travel times from CDOT. Get a free key at
      manage-api.cotrip.org and paste it here. Stays on your Home Assistant.
