<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e6a70" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f5d62" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <title>Workouts</title>
  <link rel="manifest" href="static/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="static/icon-192.png">
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
  <link rel="preload" href="static/fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="static/app.css?v=0.15.0">
</head>
<body>
  <header class="top">
    <button type="button" class="back" id="back" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>Records</button>
    <div class="title"><span id="page-title">Today</span><span id="date"></span></div>
    <span id="save-state" class="save-state" aria-live="polite"></span>
    <div id="lh-sub" class="lh-sub"></div>
    <div id="lh-scores" class="lh-scores"></div>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="timer" class="timerbar" hidden aria-live="polite"></div>
  <div id="qg" class="qgplayer" hidden role="dialog" aria-label="Guided qigong"></div>
  <div id="trophy" class="trophy" hidden role="dialog" aria-label="New personal records"></div>
  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="today" class="active"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM8.5 12l2 2 4-4M8.5 17h7"/></svg>Today</button>
    <button type="button" data-tab="week"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M7.5 14h2M11 14h2M14.5 14h2M7.5 17h2"/></svg>Week</button>
    <button type="button" data-tab="coach"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V17A2.5 2.5 0 0 1 4 14.5z"/><path d="M8.5 9h7M8.5 12h4.5"/></svg>Coach</button>
    <button type="button" data-tab="mind"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.5c-1.9-1.6-3-4-3-6.7 0-2.6 1.1-4.8 3-6.3 1.9 1.5 3 3.7 3 6.3 0 2.7-1.1 5.1-3 6.7z"/><path d="M12 19.5c-3.6.2-7-1.7-8.5-4.7 2.6-.7 5 0 6.8 1.6M12 19.5c3.6.2 7-1.7 8.5-4.7-2.6-.7-5 0-6.8 1.6"/></svg>Mind &amp; Body</button>
    <button type="button" data-tab="more"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1.1"/><circle cx="4.8" cy="12" r="1.1"/><circle cx="4.8" cy="17.5" r="1.1"/></svg>Records</button>
  </nav>
  <script src="static/app.js?v=0.15.0"></script>
</body>
</html>
