configuration:
  claude_code_oauth_token:
    name: Claude token
    description: >-
      Lets the AI Coach use your Claude Max subscription (no API fees). Run
      `claude setup-token` in the Claude Terminal add-on and paste the token here.
  equipment:
    name: Equipment you have
    description: >-
      The daily plan adds extra exercises from the Exercise Library that use only this
      equipment. Barbell moves are always left out for your kidney.
  api_ninjas_key:
    name: API Ninjas key
    description: >-
      Optional. Adds API Ninjas' ~3,000 exercises to the Exercise Library. The free tier is
      collected in the background over a day or two (5 exercises per call). Stays on your
      Home Assistant.
  s3_endpoint:
    name: Bucket endpoint
    description: >-
      Shows the yoga pictures from your private bucket. Use the same endpoint as the Trading
      Terminal (for Backblaze B2 it looks like https://s3.us-west-004.backblazeb2.com).
  s3_bucket:
    name: Bucket name
    description: Name of the bucket holding the pictures.
  s3_access_key:
    name: Bucket access key
    description: The key ID. A read-only key limited to this bucket is enough. Stays on your Home Assistant.
  s3_secret_key:
    name: Bucket secret key
    description: The secret that goes with the access key.
  s3_region:
    name: Bucket region
    description: Leave as "auto" unless your storage provider asks for a region name.
  s3_prefix:
    name: Pictures folder
    description: Folder inside the bucket where the pictures are (workout/yoga).
  api_ninjas_monthly_budget:
    name: API Ninjas calls per month
    description: >-
      Most calls the add-on makes per month (free tier allows 3,000). It also stays under 90
      calls an hour. Lower it if you use the same key elsewhere.
