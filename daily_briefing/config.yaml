name: "Daily Briefing"
description: "Your day at a glance on the TV: date, weather, calendar, workout, meals, what's due, ski, money and shopping. Published as Home Assistant sensors with a ready-made dashboard to cast, plus an optional morning summary on your phone."
version: "0.1.1"
slug: "daily_briefing"
image: "ghcr.io/j0eyoung/{arch}-ha-daily-briefing"
arch:
  - aarch64
  - amd64
init: false
# Served only through Home Assistant (Open Web UI + sidebar panel). No port is published to the LAN.
ingress: true
ingress_port: 8506
panel_icon: mdi:television-ambient-light
panel_title: "Briefing"
# Home Assistant API: reads weather, calendars and the shopping list, publishes the sensor.daily_briefing_* sensors
# and sends the morning phone summary. No hassio_api: every add-on may read its own /addons/self/info.
homeassistant_api: true
# Read-only Home Assistant config folder, only for the shared addon_secrets.json. Nothing is written to disk.
map:
  - type: homeassistant_config
    read_only: true
options:
  notify_service: ""
  morning_notification: true
  morning_time: "07:00"
  refresh_seconds: 60
  calendars: []
  weather_entity: ""
  shopping_list: "todo.shopping_list"
  api_token: ""
  api_key: ""
schema:
  notify_service: str?
  morning_notification: bool?
  morning_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?"
  refresh_seconds: "int(30,600)?"
  calendars: "[str]?"
  weather_entity: str?
  shopping_list: str?
  api_token: password?
  api_key: password?
