name: "Home Maintenance Log"
description: "Recurring home upkeep with phone reminders (Done / Snooze), printer toner alerts that add the cartridge to the shopping list, and an appliance and warranty register."
version: "0.2.0"
slug: "home_maintenance"
image: "ghcr.io/j0eyoung/{arch}-ha-home-maintenance"
arch:
  - aarch64
  - amd64
init: false
# Served only through Home Assistant (Open Web UI + sidebar panel). No port is published to the LAN.
ingress: true
ingress_port: 8504
panel_icon: mdi:home-wrench
panel_title: "Home"
# Home Assistant API: phone reminders, the Done / Snooze button taps, toner sensors and the shopping list.
homeassistant_api: true
# The add-on's own config folder (mounted at /config inside the container) holds home_maintenance.db.
map:
  - type: addon_config
    read_only: false
  - type: homeassistant_config
    read_only: true
options:
  notify_service: ""
  reminder_time: "09:00"
  todo_entity: "todo.shopping_list"
  toner_entities: ""
  toner_threshold: 15
  printer_model: ""
  s3_endpoint: ""
  s3_bucket: ""
  s3_access_key: ""
  s3_secret_key: ""
  s3_region: "auto"
  s3_prefix: "home/receipts"
schema:
  notify_service: str?
  reminder_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?"
  todo_entity: str?
  toner_entities: str?
  toner_threshold: int(1,90)?
  printer_model: str?
  s3_endpoint: url?
  s3_bucket: str?
  s3_access_key: password?
  s3_secret_key: password?
  s3_region: str?
  s3_prefix: str?
